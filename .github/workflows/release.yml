# Push a vX.Y.Z tag to publish ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :X and create the
# GitHub Release with that version's CHANGELOG section as its notes. Run it by hand
# (workflow_dispatch) to check the multi-arch build without publishing anything.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release metadata before publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == version, "tag/package version mismatch"
          assert re.search(r"^## \[" + re.escape(version) + r"\]", Path("CHANGELOG.md").read_text(), re.M), "missing versioned changelog"
          PY
      - run: python -B -m unittest discover -s tests
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  github-release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if ($2 == "[" v "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n\nImage: `ghcr.io/%s:%s`.\n' "$GITHUB_REPOSITORY" "$version" >> notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
